project_root

# Preserve existing public MATLAB names (Cine.LoadFrame, PixelArray, etc.) while
# enforcing consistent formatting. Naming rules still reject invalid tokens.
regex_class_name: "[A-Z][A-Za-z0-9]*"
regex_function_name: "[A-Za-z][A-Za-z0-9_]*"
regex_method_name: "[A-Za-z][A-Za-z0-9_]*"
regex_attribute_name: "[A-Za-z][A-Za-z0-9_]*"
regex_parameter_name: "[A-Za-z][A-Za-z0-9_]*"
regex_script_name: "[a-z][a-z0-9_]*"
regex_nested_name: "[A-Za-z][A-Za-z0-9_]*"

tab_width: 4
line_length: 120
newline_style: "lf"

# The repository uses a project license rather than per-file copyright notices.
suppress_rule: "copyright_notice"
