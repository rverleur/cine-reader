# Python users should not need a separate Microsoft C runtime installation.
# Rust allocates and releases its own buffers through the C ABI.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
